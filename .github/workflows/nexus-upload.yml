name: Nexus Upload

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mod_key:
        description: "Which mod to package and upload"
        required: true
        type: choice
        options:
          - stardew-valley-bg
          - uiinfosuite2alt
      version:
        description: "Version for manual upload. Leave empty for manifest-based mods."
        required: false
        type: string
      changelog:
        description: "Description/changelog for the Nexus file entry"
        required: false
        type: string
      dry_run:
        description: "Only package the ZIP and validate config, skip Nexus upload"
        required: true
        default: false
        type: boolean

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Package mod archive
        id: package
        shell: pwsh
        run: >
          ./scripts/package-mod.ps1
          -ModKey '${{ github.event_name == 'release' && 'stardew-valley-bg' || inputs.mod_key }}'
          -VersionOverride '${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}'

      - name: Upload packaged archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: ${{ steps.package.outputs.archive_path }}

      - name: Upload archive to Nexus Mods
        if: ${{ github.event_name == 'release' || !inputs.dry_run }}
        uses: Nexus-Mods/upload-action@main
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_group_id: ${{ steps.package.outputs.file_group_id }}
          filename: ${{ steps.package.outputs.archive_path }}
          display_name: ${{ steps.package.outputs.file_name }}
          description: ${{ inputs.changelog || steps.package.outputs.description }}
          version: ${{ steps.package.outputs.version }}
          file_category: ${{ steps.package.outputs.category }}
          archive_existing_file: ${{ steps.package.outputs.archive_existing_file }}
