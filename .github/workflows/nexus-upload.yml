name: Package Mod for Release

on:
  workflow_dispatch:
    inputs:
      mod_key:
        description: "Which mod to package"
        required: true
        type: choice
        options:
          - stardew-valley-bg
          - uiinfosuite2alt
      version:
        description: "Version for manual packaging. Leave empty for manifest-based mods."
        required: false
        type: string
      changelog:
        description: "Description/changelog for the Nexus file entry"
        required: false
        type: string
      upload_to_nexus:
        description: "Attempt direct upload to Nexus Mods"
        required: true
        default: false
        type: boolean

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package mod archive
        id: package
        shell: pwsh
        run: >
          ./scripts/package-mod.ps1
          -ModKey '${{ inputs.mod_key }}'
          -VersionOverride '${{ inputs.version }}'

      - name: Upload packaged archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: ${{ steps.package.outputs.archive_path }}

      - name: Show packaged release summary
        shell: bash
        run: |
          echo "Mod: ${{ steps.package.outputs.label }}"
          echo "Version: ${{ steps.package.outputs.version }}"
          echo "Archive: ${{ steps.package.outputs.archive_name }}"
          echo "File Group ID: ${{ steps.package.outputs.file_group_id }}"

      - name: Upload archive to Nexus Mods
        if: ${{ inputs.upload_to_nexus }}
        uses: Nexus-Mods/upload-action@main
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_group_id: ${{ steps.package.outputs.file_group_id }}
          filename: ${{ steps.package.outputs.archive_path }}
          display_name: ${{ steps.package.outputs.file_name }}
          description: ${{ inputs.changelog || steps.package.outputs.description }}
          version: ${{ steps.package.outputs.version }}
          file_category: ${{ steps.package.outputs.category }}
          archive_existing_file: ${{ steps.package.outputs.archive_existing_file }}
